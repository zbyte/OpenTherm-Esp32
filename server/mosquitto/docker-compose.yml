# Mosquitto in front of ThingsBoard: the board connects here, the bridge
# carries its topics to ThingsBoard Cloud. See docs/mosquitto.md.
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
