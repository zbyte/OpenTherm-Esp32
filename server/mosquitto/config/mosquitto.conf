# Local broker for the OpenTherm board(s); the bridge to ThingsBoard is in
# conf.d/bridge.conf (made from bridge.conf.example, holds the device token).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%d %H:%M:%S
connection_messages true

listener 1883
# Only clients from the password file: user name = device token, password =
# the one set on the board with "tb pass". acl (from acl.example) limits that
# user to the ThingsBoard device topics.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# The board talks small messages; a firmware chunk is 1 KB.
max_packet_size 65536

include_dir /mosquitto/config/conf.d
